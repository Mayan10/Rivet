name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=rivet --cov-report=term-missing

      - name: CLI smoke test
        run: |
          rivet generate --width 15 --length 13 \
            --room living_room --room master_bedroom+ensuite \
            --room bedroom:2+ensuite --room kitchen --room dining_room \
            --room bathroom --seed 1 --out-dir /tmp/rivet-ci-out
          test -f /tmp/rivet-ci-out/candidate-1.dxf

  service-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # GitHub Actions service containers can't override the image's
      # command, and the official minio/minio image needs `server /data`
      # passed explicitly -- bitnami's minio default CMD already does
      # that, reading MINIO_ROOT_USER/MINIO_ROOT_PASSWORD from env, which
      # is why this is a different image than docker-compose.yml's.
      # bitnami/minio:latest 404s as of this writing -- Bitnami moved
      # their free-tier images to bitnamilegacy/* with pinned tags only,
      # no `latest`. Pin a real, currently-active tag rather than
      # guessing another one blind; check
      # https://hub.docker.com/r/bitnamilegacy/minio/tags if this 404s
      # again later.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: rivet
          MINIO_ROOT_PASSWORD: rivet-dev-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rivet:rivet@localhost:5432/rivet
      REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      # Single Python version for the service layer (not the full 3.10-3.12
      # matrix the engine gets) -- FastAPI/SQLAlchemy version compatibility
      # across that range isn't the thing this job exists to catch, and it
      # would triple the runtime for no real signal.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (with dev + service extras)
        run: pip install -e ".[dev,service]"

      # Linting the whole repo (including src/rivet_service, tests/service)
      # already happens in the `test` job's `ruff check src tests` -- no
      # need to repeat it here.

      - name: Run migrations
        run: alembic -c alembic.ini upgrade head

      - name: Test
        run: pytest tests/service -q

      - name: Build image
        run: docker build -t rivet-service:ci .
