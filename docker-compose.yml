# Local dev only. `docker compose up` should need no cloud account
# (docs/saas-buildout.md section 10). Phase 6 stood up all 5 services
# ahead of Phase 8 actually using Redis/MinIO, so the topology wouldn't
# need to change later -- it didn't; only the worker's command did.
#
# Migrations are a deliberate, separate step -- never run them from a
# container's own entrypoint (two containers booting at once would race
# to apply them). After the first `docker compose up`, run:
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python -c \
#     "from rivet_service.storage import get_storage_adapter; get_storage_adapter().ensure_bucket()"
#   # (only needed the first time, and only if STORAGE_BACKEND=s3)

# Shared by api and worker so the two never drift -- both need the same
# DB/queue/storage view of the world. A top-level "x-" key is a Docker
# Compose extension field: ignored as a service definition, usable only
# via the &service-env YAML anchor below.
x-service-env: &service-env
  DATABASE_URL: postgresql+psycopg://rivet:rivet@postgres:5432/rivet
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_BUCKET: rivet-artifacts
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: rivet
  S3_SECRET_KEY: rivet-dev-secret

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: rivet
      POSTGRES_DB: rivet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rivet
      MINIO_ROOT_PASSWORD: rivet-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: ["uvicorn", "rivet_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *service-env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "rivet_service.jobs.worker"]
    environment:
      <<: *service-env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
