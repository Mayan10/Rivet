[alembic]
script_location = apps/api/rivet_service/db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted -- env.py reads it from
# rivet_service.config.get_settings() (DATABASE_URL env var) so there is
# exactly one place the connection string is configured, matching
# config.py's own "all env vars in one place" rule.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
